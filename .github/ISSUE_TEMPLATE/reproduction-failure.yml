name: Reproduction failure or evidence gap
description: Report an anonymized failure that can become a regression case.
title: "reproduction: "
labels: ["reproduction"]
body:
  - type: markdown
    attributes:
      value: "Do not include private data, credentials, licensed paper text, private repository URLs, or unpublished results."
  - type: textarea
    id: expected
    attributes:
      label: Expected evidence status
      description: State the V1 claim status and why.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include anonymized command IDs, public fixture details, and the actual status.
    validations:
      required: true
  - type: textarea
    id: minimal_case
    attributes:
      label: Minimal reproducible case
      description: Provide only the smallest public or fictional inputs needed to reproduce the issue.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - missing artifact
        - access or license
        - environment drift
        - repository drift
        - undeclared write
        - capability violation
        - secret exposure
        - execution error
        - observation unbound
        - extractor error
        - protocol ambiguity
        - statistical insufficiency
        - metric mismatch
        - resource limit
        - provenance mismatch
    validations:
      required: true
