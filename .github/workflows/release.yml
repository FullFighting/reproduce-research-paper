name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and verify source archive
        run: |
          git archive --format=tar.gz --prefix="reproduce-research-paper-${RELEASE_TAG}/" -o "$RUNNER_TEMP/reproduce-research-paper-${RELEASE_TAG}.tar.gz" "$RELEASE_TAG"
          python scripts/verify_release_archive.py --archive "$RUNNER_TEMP/reproduce-research-paper-${RELEASE_TAG}.tar.gz"
      - name: Generate checksums, SPDX SBOM, and provenance
        run: |
          python scripts/build_release_artifacts.py \
            --repository . \
            --archive "$RUNNER_TEMP/reproduce-research-paper-${RELEASE_TAG}.tar.gz" \
            --output-dir release-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts-${{ env.RELEASE_TAG }}
          path: release-artifacts/
          if-no-files-found: error
      - name: Create GitHub build attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-artifacts/reproduce-research-paper-${{ env.RELEASE_TAG }}.tar.gz
      - name: Attach artifacts to GitHub Release
        run: gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
