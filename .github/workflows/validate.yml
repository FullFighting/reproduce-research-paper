name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: python -m compileall -q skills/reproduce-research-paper/scripts scripts
      - name: Check generated benchmark facts
        run: python scripts/sync_benchmark_facts.py --check
      - name: Validate Codex planning evaluation
        run: python scripts/validate_codex_evaluation.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
